worker_processes 1;

events {
    worker_connections 256;
}

http {
    # IP asli pemanggil: di belakang Cloudflare Tunnel, alamatnya ada di header Cf-Connecting-Ip.
    map $http_cf_connecting_ip $client_ip {
        default $http_cf_connecting_ip;
        ""      $remote_addr;
    }

    # Pemanggil ber-API key dihitung per key, selain itu per IP.
    map $http_x_api_key $limit_id {
        default $http_x_api_key;
        ""      $client_ip;
    }

    # Batas pemanggilan: 60/menit per IP (publik), 300/menit per API key.
    limit_req_zone $client_ip zone=publik:10m rate=60r/m;
    limit_req_zone $limit_id  zone=privat:10m rate=300r/m;
    # Login dan daftar lebih ketat untuk menyulitkan tebak password: 10/menit per IP.
    limit_req_zone $client_ip zone=auth:10m rate=10r/m;
    limit_req_status 429;

    upstream core {
        server core-service:8000;
    }

    server {
        listen 80;
        server_tokens off;

        error_page 429 = @terlalu_sering;

        location @terlalu_sering {
            default_type application/json;
            add_header Retry-After 10 always;
            return 429 '{"error":{"code":"too_many_requests","message":"Batas pemanggilan terlampaui."}}';
        }

        # Endpoint publik tanpa login.
        location ~ ^/api/(health|assessments/quick)$ {
            limit_req zone=publik burst=20 nodelay;
            proxy_pass http://core;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $client_ip;
        }

        # Login dan daftar.
        location ~ ^/api/auth/(login|register)$ {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://core;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $client_ip;
        }

        # Endpoint lain di bawah /api (login atau API key).
        location /api/ {
            limit_req zone=privat burst=50 nodelay;
            proxy_pass http://core;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $client_ip;
        }

        location / {
            default_type application/json;
            return 404 '{"error":{"code":"not_found","message":"Path tidak ditemukan."}}';
        }
    }
}
